<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NoteViz · 可视化知识学习平台</title>
    <style>
      :root {
        --bg: #0f1217;
        --surface: #161b22;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #303740;
        --accent: #1677ff;
        --accent-on: #ffffff;
        --accent-soft: color-mix(in oklch, var(--accent) 16%, transparent);
        --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
        --success: #3fb950;
        --danger: #f85149;
        --warn: #d29922;
        --surface-2: #1c222b;
        --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
        --font-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
        --text-xs: 11px;
        --text-sm: 12px;
        --text-base: 14px;
        --text-lg: 16px;
        --text-xl: 22px;
        --text-2xl: 30px;
        --leading-body: 1.7;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: var(--text-base)/var(--leading-body) var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--font-display);
        text-wrap: balance;
      }
      svg {
        display: block;
      }
      .num,
      .meta,
      .eyebrow {
        font-family: var(--font-mono);
      }
      .topnav {
        height: 56px;
        position: fixed;
        inset: 0 0 auto;
        z-index: 20;
        background: color-mix(in oklch, var(--bg) 94%, transparent);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .topnav-inner {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 0 24px;
      }
      .logo {
        font: 700 18px var(--font-display);
        letter-spacing: -0.03em;
        min-width: 176px;
      }
      .logo-v {
        color: var(--accent);
        position: relative;
      }
      .logo-v::after {
        content: "";
        position: absolute;
        height: 2px;
        background: var(--accent);
        left: 1px;
        right: 1px;
        bottom: 0;
      }
      .domain-nav,
      .utility-nav {
        height: 100%;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .domain-nav button,
      .utility-nav button {
        height: 100%;
        position: relative;
        border: 0;
        background: transparent;
        padding: 0 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .domain-nav button:hover,
      .utility-nav button:hover {
        color: var(--fg);
      }
      .domain-nav button.active,
      .utility-nav button.active {
        color: var(--fg);
        font-weight: 600;
      }
      .domain-nav button.active::after,
      .utility-nav button.active::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: -1px;
        height: 2px;
        background: var(--accent);
      }
      .utility-nav {
        margin-left: auto;
        border-left: 1px solid var(--border);
        padding-left: 18px;
      }
      .utility-nav button[data-plan-open] {
        border: 1px solid var(--border);
        height: 34px;
        border-radius: var(--radius-sm);
        padding: 0 12px;
      }
      .utility-nav button[data-plan-open]:hover {
        border-color: var(--fg);
        background: var(--fg-soft);
      }
      .topnav-status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font: 11px var(--font-mono);
      }
      .status-dot {
        width: 7px;
        height: 7px;
        background: var(--success);
        border-radius: 50%;
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--success) 15%, transparent);
      }
      .app-shell {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        min-height: 100vh;
        padding-top: 56px;
      }
      .sidebar {
        border-right: 1px solid var(--border);
        padding: 24px 16px;
        overflow: auto;
        position: sticky;
        top: 56px;
        height: calc(100vh - 56px);
      }
      .side-kicker {
        color: var(--muted);
        font: 10px var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin: 0 8px 18px;
      }
      .mastery-legend {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 8px;
        margin: 0 8px 20px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 10px;
      }
      .legend-item .mastery-dot {
        width: 7px;
        height: 7px;
      }
      .section-toggle {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 0;
        background: transparent;
        padding: 9px 8px;
        color: var(--fg);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .section-toggle .chevron {
        transition: transform 0.2s ease;
        color: var(--muted);
      }
      .section-toggle[aria-expanded="true"] .chevron {
        transform: rotate(90deg);
      }
      .section-list {
        margin: 0 0 12px;
      }
      .module {
        margin: 2px 0;
      }
      .module-head {
        width: 100%;
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 9px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        background: transparent;
        padding: 0 10px;
        color: var(--muted);
        text-align: left;
        font-size: 13px;
        transition:
          transform 0.16s ease,
          border-color 0.16s ease,
          background 0.16s ease;
      }
      .module-head:hover {
        color: var(--fg);
        background: var(--fg-soft);
      }
      .module-head.active {
        background: var(--accent-soft);
        border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
        color: var(--fg);
      }
      .module-head .module-icon {
        font: 12px var(--font-mono);
        color: var(--accent);
        width: 14px;
      }
      .count {
        margin-left: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--muted);
        font: 10px var(--font-mono);
      }
      .topic-list {
        display: none;
        padding: 4px 0 6px 33px;
      }
      .module.open .topic-list {
        display: block;
      }
      .topic-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 8px;
        color: var(--muted);
        font-size: 12px;
        border-left: 1px solid var(--border);
      }
      .topic-link:hover,
      .topic-link.active {
        color: var(--fg);
        border-left-color: var(--accent);
      }
      .mastery-dot {
        flex: 0 0 auto;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        box-shadow: 0 0 0 2px color-mix(in oklch, var(--muted) 14%, transparent);
      }
      .mastery-dot.level-1 {
        background: var(--muted);
      }
      .mastery-dot.level-2 {
        background: color-mix(in oklch, var(--accent) 45%, var(--muted));
      }
      .mastery-dot.level-3 {
        background: var(--accent);
      }
      .mastery-dot.level-4 {
        background: color-mix(in oklch, var(--warn) 78%, var(--accent));
      }
      .mastery-dot.level-5 {
        background: var(--success);
      }
      .main {
        min-width: 0;
        padding: 28px 32px 56px;
      }
      .content-width {
        max-width: 1120px;
        margin: 0 auto;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font: 11px var(--font-mono);
        margin-bottom: 20px;
      }
      .breadcrumb span:last-child {
        color: var(--fg);
      }
      .view-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .view-head h1 {
        font-size: 30px;
        line-height: 1.2;
      }
      .view-head p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 7px;
      }
      .head-actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0 14px;
        background: transparent;
        font-size: 12px;
        transition:
          background 0.16s ease,
          border-color 0.16s ease,
          transform 0.1s ease;
      }
      .btn:hover {
        background: var(--fg-soft);
        border-color: var(--fg);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-on);
      }
      .btn-primary:hover {
        background: color-mix(in oklch, var(--accent) 86%, black);
        border-color: color-mix(in oklch, var(--accent) 86%, black);
      }
      .btn:focus-visible,
      .domain-nav button:focus-visible,
      .module-head:focus-visible,
      .topic-link:focus-visible,
      .tab-btn:focus-visible,
      .option:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .overview-hero {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        padding: 8px 0 28px;
        border-bottom: 1px solid var(--border);
      }
      .overview-hero h1 {
        font-size: 32px;
        line-height: 1.2;
        max-width: 620px;
      }
      .overview-hero p:not(.eyebrow) {
        color: var(--muted);
        font-size: 13px;
        margin-top: 8px;
      }
      .overview-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 24px 0;
      }
      .overview-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 18px;
      }
      .overview-card h3 {
        font-size: 14px;
        margin-bottom: 10px;
      }
      .overview-card p {
        color: var(--muted);
        font-size: 12px;
      }
      .overview-number {
        font: 600 28px var(--font-mono);
        margin: 8px 0;
      }
      .continue-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 20px;
        background: var(--accent-soft);
        border: 1px solid color-mix(in oklch, var(--accent) 42%, var(--border));
        border-radius: var(--radius-md);
        margin-bottom: 24px;
      }
      .continue-card h2 {
        font-size: 17px;
      }
      .continue-card p {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .home-columns {
        display: grid;
        grid-template-columns: 1.35fr 1fr;
        gap: 24px;
        margin-top: 24px;
      }
      .home-panel {
        min-width: 0;
      }
      .home-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .home-panel-head h2 {
        font-size: 16px;
      }
      .home-panel-head span {
        color: var(--muted);
        font: 10px var(--font-mono);
      }
      .overview-section-title {
        font: 11px var(--font-mono);
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 10px;
      }
      .overview-topic-list,
      .review-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .overview-topic,
      .review-topic {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        padding: 11px 13px;
        text-align: left;
      }
      .overview-topic:hover,
      .review-topic:hover {
        border-color: var(--accent);
        background: var(--surface-2);
      }
      .overview-topic span:nth-child(2),
      .review-topic span:nth-child(2) {
        font-size: 12px;
      }
      .overview-topic small,
      .review-topic small {
        margin-left: auto;
        color: var(--muted);
        font: 10px var(--font-mono);
      }
      .review-topic .review-arrow {
        color: var(--muted);
        font: 14px var(--font-mono);
      }
      .empty-mini {
        padding: 22px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .summary-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }
      .summary-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 14px 16px;
      }
      .summary-label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .summary-value {
        font: 600 18px var(--font-mono);
      }
      .knowledge-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .knowledge-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto 92px;
        gap: 16px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px 18px;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          background 0.18s ease;
      }
      .knowledge-card:hover {
        transform: translateX(4px);
        border-color: var(--accent);
        background: var(--surface-2);
      }
      .knowledge-card h3 {
        font-size: 14px;
        line-height: 1.45;
      }
      .knowledge-card p {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 7px;
        color: var(--muted);
        font: 11px var(--font-mono);
        white-space: nowrap;
      }
      .tag.depth {
        color: var(--accent);
        border-color: color-mix(in oklch, var(--accent) 46%, var(--border));
      }
      .dots {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .dot {
        width: 7px;
        height: 7px;
        border: 1px solid var(--muted);
        border-radius: 50%;
      }
      .dot.filled {
        background: var(--accent);
        border-color: var(--accent);
      }
      .empty {
        min-height: 440px;
        display: grid;
        place-items: center;
        text-align: center;
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        color: var(--muted);
      }
      .empty strong {
        display: block;
        color: var(--fg);
        font-size: 15px;
        margin-bottom: 6px;
      }
      .empty small {
        font: 11px var(--font-mono);
      }
      .detail-view {
        display: none;
      }
      .detail-view.visible {
        display: block;
      }
      .list-view.hidden {
        display: none;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 18px;
      }
      .back-link:hover {
        color: var(--fg);
      }
      .detail-title {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
      }
      .detail-title h1 {
        font-size: 30px;
        line-height: 1.22;
        max-width: 800px;
      }
      .meta-row {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font: 11px var(--font-mono);
        margin-top: 12px;
      }
      .meta-row .divider {
        color: var(--border);
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        margin-top: 28px;
      }
      .tab-btn {
        min-height: 45px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        padding: 0 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .tab-btn:hover {
        color: var(--fg);
      }
      .tab-btn.active {
        border-bottom-color: var(--accent);
        color: var(--fg);
        font-weight: 600;
      }
      .tab-panel {
        display: none;
        padding-top: 24px;
      }
      .tab-panel.active {
        display: block;
      }
      .reading-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 24px;
      }
      .reading-copy {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 24px;
      }
      .reading-copy h2 {
        font-size: 18px;
        margin-bottom: 16px;
      }
      .reading-copy h3 {
        font-size: 14px;
        margin: 22px 0 8px;
      }
      .reading-copy p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }
      .code-block {
        margin-top: 18px;
        padding: 16px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--fg);
        font: 12px/1.7 var(--font-mono);
        overflow: auto;
      }
      .diagram {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 18px;
      }
      .diagram-label {
        display: inline-block;
        color: var(--muted);
        font: 10px var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .diagram-flow {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .flow-node {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        text-align: center;
        font: 12px var(--font-mono);
        background: var(--surface-2);
      }
      .flow-node.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .flow-arrow {
        color: var(--muted);
        font-family: var(--font-mono);
      }
      .study-mode-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }
      .mode-tabs,
      .plan-tabs {
        display: flex;
        gap: 4px;
      }
      .mode-btn,
      .bookmark-btn,
      .review-complete,
      .rating-btn,
      .plan-tab {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        padding: 7px 10px;
      }
      .mode-btn.active,
      .mode-btn:hover,
      .bookmark-btn:hover,
      .rating-btn:hover,
      .plan-tab.active,
      .plan-tab:hover {
        border-color: var(--accent);
        color: var(--fg);
        background: var(--accent-soft);
      }
      .mode-summary {
        margin-left: auto;
        color: var(--muted);
        font: 11px var(--font-mono);
      }
      .rating-group {
        display: flex;
        gap: 3px;
        margin-left: auto;
      }
      .rating-btn {
        width: 27px;
        padding: 5px 0;
        font: 11px var(--font-mono);
      }
      .review-complete {
        margin-left: auto;
        color: var(--accent);
        border-color: color-mix(in oklch, var(--accent) 48%, var(--border));
      }
      .review-complete.done {
        color: var(--success);
        border-color: var(--success);
      }
      .chapter-heading {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chapter-heading .bookmark-btn {
        opacity: 0;
        transition: opacity 0.16s ease;
        font-size: 10px;
        padding: 4px 7px;
      }
      .chapter-heading:hover .bookmark-btn,
      .reading-copy .bookmark-btn:focus-visible {
        opacity: 1;
      }
      .bookmark-menu {

          '</div></section><section class="home-panel"><div class="home-panel-head"><h2>学习建议</h2><span>从低成本动作开始</span></div><div class="review-list"><button class="review-topic" data-global-action="plan"><span class="mastery-dot level-2"></span><span>配置本周学习计划</span><span class="review-arrow">→</span></button><button class="review-topic" data-global-action="review"><span class="mastery-dot level-3"></span><span>进入待复习内容</span><span class="review-arrow">→</span></button></div></section></div>';
        $("#listView").querySelector("[data-overview-plan]").addEventListener("click", openPlan);
        $("#listView")
          .querySelectorAll("[data-switch-domain]")
          .forEach((button) =>
            button.addEventListener("click", () => {
              state.domain = button.dataset.switchDomain;
              state.home = false;
              state.module = null;
              document
                .querySelectorAll("[data-domain],[data-home]")
                .forEach((item) =>
                  item.classList.toggle("active", item.dataset.domain === state.domain),
                );
              renderSidebar();
              renderList();
            }),
          );
        $("#listView")
          .querySelector('[data-global-action="plan"]')
          .addEventListener("click", openPlan);
        $("#listView")
          .querySelector('[data-global-action="review"]')
          .addEventListener("click", () => {
            state.home = false;
            state.module = currentDomain().sections[0].modules[0].id;
            renderSidebar();
            renderList();
          });
      }
      function renderOverview() {
        if (state.home) {
          renderGlobalOverview();
        } else {
          renderDomainOverview();
        }
      }
      function moduleForTopic(topicId) {
        return (
          currentDomain()
            .sections.flatMap((section) => section.modules)
            .find((module) => topicsFor(module.id).some((topic) => topic.id === topicId))?.id ||
          currentDomain().sections[0].modules[0].id
        );
      }
      function currentDomain() {
        return domains[state.domain];
      }
      function moduleInfo(id) {
        return currentDomain()
          .sections.flatMap((s) => s.modules)
          .find((m) => m.id === id);
      }
      function topicsFor(id) {
        return (
          knowledge[id] ||
          moduleInfo(id).topics.map((q, i) => ({
            ...fallback,
            id: id + "-" + i,
            q,
            depth: i % 3 === 0 ? "浅" : i % 3 === 1 ? "中" : "深",
            rich: i % 2 ? "图" : "文",
            difficulty: 2 + (i % 4),
            summary: "围绕 " + q + " 建立清晰的概念边界与实践判断。",
            content: [
              "这是一个适合拆分为问题、回答与扩展知识的学习单元。先确定术语，再用实际场景验证。",
              "学习时可以从现象倒推机制，并把结论记录为可复用的问答。",
            ],
            code: "// " + q,
            mermaid: ["问题定义", "机制拆解", "案例验证"],
            quiz: fallback.quiz,
            related: fallback.related,
          }))
        );
      }
      function quizTypeLabel(type) {
        return (
          { single: "单选题", multi: "多选题", judge: "判断题", sort: "排序题" }[type] || "综合题"
        );
      }
      function showQuizResult(t, correct) {
        recordMastery(t.id, correct);
        const feedback = $("#feedback");
        const explanation = $("#explanation");
        const list = topicsFor(state.module);
        const next = list[(list.findIndex((item) => item.id === t.id) + 1) % list.length];
        feedback.textContent = correct
          ? "回答正确：判断抓住了关键。"
          : "回答不正确：请结合解析复盘这一题。";
        feedback.className = "feedback " + (correct ? "success" : "error");
        explanation.innerHTML =
          "<strong>答案解析</strong>" +
          esc(t.quiz.explanation) +
          '<br><button class="btn" data-next-topic="' +
          next.id +
          '" data-next-module="' +
          state.module +
          '">下一题 →</button>';
        explanation.classList.add("visible");
        explanation
          .querySelector("[data-next-topic]")
          .addEventListener("click", () => openTopic(next.id, state.module));
      }
      function enhanceQuiz(t) {
        const quiz = t.quiz;
        const card = $("#detailView .quiz-card");
        const optionBox = card.querySelector(".options");
        card.querySelector(".eyebrow").textContent = "即时练习 / " + quizTypeLabel(quiz.type);
        card.insertAdjacentHTML("beforeend", '<div class="explanation" id="explanation"></div>');
        if (quiz.type === "multi") {
          card.querySelector("p:not(.eyebrow)").textContent = "可选择多个答案，选完后提交。";
          optionBox.insertAdjacentHTML(
            "afterend",
            '<button class="btn btn-primary quiz-submit" id="submit-multi">提交答案</button>',
          );
        }
        if (quiz.type === "sort") {
          optionBox.className = "sort-list";
          optionBox.innerHTML = quiz.items
            .map(
              (item, i) =>
                '<div class="sort-row" data-sort-index="' +
                i +
                '"><span class="sort-index">' +
                (i + 1).toString().padStart(2, "0") +
                "</span><span>" +
                esc(item) +
                '</span><span class="sort-controls"><button class="sort-move" data-move="up" aria-label="上移">↑</button><button class="sort-move" data-move="down" aria-label="下移">↓</button></span></div>',
            )
            .join("");
          optionBox.insertAdjacentHTML(
            "afterend",
            '<button class="btn btn-primary quiz-submit" id="submit-sort">提交排序</button>',
          );
        }
      }
      function renderSidebar() {
        const wrap = $("#sidebarSections");
        wrap.innerHTML = currentDomain()
          .sections.map(
            (s, si) =>
              '<div class="sidebar-section" data-od-id="sidebar-section-' +
              si +
              '"><button class="section-toggle" aria-expanded="true" data-section="' +
              si +
              '">' +
              esc(s.name) +
              '<span class="chevron">›</span></button><div class="section-list">' +
              s.modules
                .map(
                  (m) =>
                    '<div class="module ' +
                    (state.module === m.id ? "open" : "") +
                    '" data-module="' +
                    m.id +
                    '"><button class="module-head ' +
                    (state.module === m.id ? "active" : "") +
                    '" data-module-open="' +
                    m.id +
                    '"><span class="module-icon">›</span><span>' +
                    esc(m.name) +
                    '</span><span class="count">' +
                    m.count +
                    '</span></button><div class="topic-list">' +
                    topicsFor(m.id)
                      .map(
                        (t) =>
                          '<a class="topic-link ' +
                          (state.topic && state.topic.id === t.id ? "active" : "") +
                          '" href="#" data-topic="' +
                          t.id +
                          '" data-module-topic="' +
                          m.id +
                          '">' +
                          masteryDot(t.id) +
                          "<span>" +
                          esc(t.q) +
                          "</span></a>",
                      )
                      .join("") +
                    "</div></div>",
                )
                .join("") +
              "</div></div>",
          )
          .join("");
        applyMasteryFilter();
        syncMasteryFilter();
        wrap.querySelectorAll("[data-section]").forEach((b) =>
          b.addEventListener("click", () => {
            const open = b.getAttribute("aria-expanded") === "true";
            b.setAttribute("aria-expanded", String(!open));
            b.nextElementSibling.style.display = open ? "none" : "";
          }),
        );
        wrap.querySelectorAll("[data-module-open]").forEach((b) =>
          b.addEventListener("click", () => {
            state.module = b.dataset.moduleOpen;
            state.home = false;
            state.topic = null;
            state.tab = "explain";
            renderSidebar();
            renderList();
          }),
        );
        wrap.querySelectorAll("[data-topic]").forEach((a) =>
          a.addEventListener("click", (e) => {
            e.preventDefault();
            openTopic(a.dataset.topic, a.dataset.moduleTopic);
          }),
        );
      }
      function renderList() {
        const d = currentDomain();
        const m = state.module ? moduleInfo(state.module) : null;
        const quizMode = state.domain === "quiz";
        if (!m) {
          $("#listView").innerHTML =
            '<div class="empty" data-od-id="empty-state"><div><strong>选择一个' +
            (quizMode ? "题库模块" : "知识模块") +
            "开始学习</strong><span>从左侧目录进入" +
            (quizMode ? "专项题目列表" : "四级知识点列表") +
            "</span></div></div>";
          return;
        }
        const items = topicsFor(m.id);
        $("#listView").innerHTML =
          '<div class="breadcrumb"><span>NoteViz</span><span>/</span><span>' +
          esc(d.label) +
          "</span><span>/</span><span>" +
          esc(m.name) +
          '</span></div><div class="view-head"><div><p class="eyebrow">' +
          (quizMode ? "专项题库" : "知识点模块") +
          " / " +
          String(m.count).padStart(2, "0") +
          ' 个单元</p><h1 data-od-id="module-title">' +
          esc(m.name) +
          "</h1><p>" +
          (quizMode
            ? "按考试式题目组织训练，完成后即时查看解析。"
            : "按问题组织学习内容，选择一个知识点进入详情。") +
          '</p></div><div class="head-actions"><button class="btn" data-od-id="filter-button">筛选难度</button><button class="btn" data-od-id="sort-button">' +
          (quizMode ? "未完成优先" : "最近学习") +
          '</button></div></div><div class="summary-strip"><div class="summary-item"><div class="summary-label">' +
          (quizMode ? "完成进度" : "模块进度") +
          '</div><div class="summary-value num">38%</div></div><div class="summary-item"><div class="summary-label">' +
          (quizMode ? "已完成题目" : "已掌握") +
          '</div><div class="summary-value num">' +
          Math.round(m.count * 0.38) +
          " / " +
          m.count +
          '</div></div><div class="summary-item"><div class="summary-label">' +
          (quizMode ? "连续学习" : "当前节奏") +
          '</div><div class="summary-value">' +
          (quizMode ? "6 天" : "稳定") +
          '</div></div></div><div class="knowledge-list" data-od-id="knowledge-cards">' +
          items
            .map(
              (t) =>
                '<button class="knowledge-card" data-topic-card="' +
                t.id +
                '" data-module-card="' +
                m.id +
                '" data-od-id="knowledge-card-' +
                t.id +
                '"><div><h3>' +
                esc(t.q) +
                "</h3><p>" +
                esc(t.summary) +
                '</p></div><span class="tag depth">' +
                esc(t.depth) +
                '</span><span class="tag">' +
                esc(t.rich) +
                "</span>" +
                dots(t.difficulty) +
                "</button>",
            )
            .join("") +
          "</div>";
        $("#listView")
          .querySelectorAll("[data-topic-card]")
          .forEach((b) =>
            b.addEventListener("click", () => openTopic(b.dataset.topicCard, b.dataset.moduleCard)),
          );
      }
      function openTopic(topicId, moduleId) {
        state.module = moduleId;
        state.home = false;
        const item = topicsFor(moduleId).find((t) => t.id === topicId) || topicsFor(moduleId)[0];
        state.topic = item;
        state.tab = state.domain === "quiz" ? "quiz" : "explain";
        state.mode = "learn";
        renderSidebar();
        renderDetail();
        $("#listView").classList.add("hidden");
        $("#detailView").classList.add("visible");
      }
      function renderDetail() {
        const t = state.topic;
        const m = moduleInfo(state.module);
        const quizMode = state.domain === "quiz";
        const tab = (id, label) =>
          '<button class="tab-btn ' +
          (state.tab === id ? "active" : "") +
          '" data-tab="' +
          id +
          '" data-od-id="tab-' +
          id +
          '">' +
          label +
          "</button>";
        $("#detailView").innerHTML =
          '<a class="back-link" href="#" data-od-id="back-to-list">← 返回知识点列表</a><div class="detail-title"><div><p class="eyebrow">' +
          (quizMode ? "刷题详情 / " : "学习详情 / ") +
          esc(m.name) +
          '</p><h1 data-od-id="topic-title">' +
          esc(t.q) +
          '</h1><div class="meta-row">' +
          dots(t.difficulty) +
          '<span class="divider">·</span><span>深度：' +
          esc(t.depth) +
          '</span><span class="divider">·</span><span>丰富度：' +
          esc(t.rich) +
          '</span></div></div><button class="btn btn-primary" data-od-id="mark-learned">' +
          (quizMode ? "完成本题" : "标记为已学") +
          '</button></div><div class="tabs" data-od-id="detail-tabs">' +
          tab("explain", "讲解") +
          tab("quiz", "刷题") +
          tab("related", "关联知识") +
          tab("stats", "学习统计") +
          '</div><div class="tab-panel ' +
          (state.tab === "explain" ? "active" : "") +
          '" data-panel="explain" data-od-id="panel-explain"><div class="reading-grid"><article class="reading-copy"><h2>先回答：' +
          esc(t.q) +
          "</h2>" +
          t.content.map((p) => "<p>" + esc(p) + "</p>").join("") +
          '<h3>用一句代码验证</h3><pre class="code-block">' +
          esc(t.code) +
          '</pre></article><aside class="diagram"><span class="diagram-label">流程图 / 学习路径</span><div class="diagram-flow">' +
          t.mermaid
            .map(
              (x, i) =>
                '<div class="flow-node ' +
                (i === 1 ? "active" : "") +
                '">' +
                esc(x) +
                "</div>" +
                (i < t.mermaid.length - 1 ? '<span class="flow-arrow">↓</span>' : ""),
            )
            .join("") +
          '</div></aside></div></div><div class="tab-panel ' +
          (state.tab === "quiz" ? "active" : "") +
          '" data-panel="quiz" data-od-id="panel-quiz"><div class="quiz-layout"><article class="quiz-card"><p class="eyebrow">即时练习 / 单选题</p><h2>' +
          esc(t.quiz.question) +
          '</h2><p>选择一个答案，系统会立即告诉你判断依据。</p><div class="options">' +
          t.quiz.options
            .map(
              (o, i) =>
                '<button class="option" data-option="' +
                i +
                '">' +
                String.fromCharCode(65 + i) +
                " · " +
                esc(o) +
                "</button>",
            )
            .join("") +
          '</div><div class="feedback" id="feedback">尚未作答</div></article></div></div><div class="tab-panel ' +
          (state.tab === "related" ? "active" : "") +
          '" data-panel="related" data-od-id="panel-related"><div class="related-grid">' +
          t.related
            .map((r, i) =>
              r[1]
                ? '<div class="related-card available" data-od-id="related-card-' +
                  i +
                  '"><a href="#" data-related="' +
                  i +
                  '">' +
                  esc(r[0]) +
                  " <span>↗</span></a><small>已存在 · 可继续深入</small></div>"
                : '<div class="related-card pending" data-od-id="related-card-' +
                  i +
                  '"><span class="pending-mark">⌑</span>' +
                  esc(r[0]) +
                  "<small>待学习 · 尚未建立内容</small></div>",
            )
            .join("") +
          '</div></div><div class="tab-panel ' +
          (state.tab === "stats" ? "active" : "") +
          '" data-panel="stats" data-od-id="panel-stats"><div class="stats-grid"><div class="stat-card"><div class="stat-label">学习进度</div><div class="stat-value num">38%</div><div class="progress"><span style="width:38%"></span></div></div><div class="stat-card"><div class="stat-label">题目正确率</div><div class="ring"><strong>78%</strong></div></div><div class="stat-card"><div class="stat-label">已学知识点数</div><div class="stat-value num">12 / 45</div><span class="tag">持续积累</span></div><div class="stat-card"><div class="stat-label">记忆强度指数</div><div class="stars">★★★★<span style="color:var(--border)">★</span></div><p style="color:var(--muted);font-size:12px;margin-top:12px">最近一次复习：今天</p></div></div></div>';
        enhanceQuiz(t);
        const mark = $('#detailView [data-od-id="mark-learned"]');
        mark.addEventListener("click", () => {
          recordMastery(t.id, true);
          mark.textContent = "已标记";
          mark.disabled = true;
        });
        $("#detailView")
          .querySelector('[data-od-id="back-to-list"]')
          .addEventListener("click", (e) => {
            e.preventDefault();
            $("#detailView").classList.remove("visible");
            $("#listView").classList.remove("hidden");
          });
        $("#detailView")
          .querySelectorAll("[data-tab]")
          .forEach((b) =>
            b.addEventListener("click", () => {
              state.tab = b.dataset.tab;
              renderDetail();
            }),
          );
        $("#detailView")
          .querySelectorAll("[data-option]")
          .forEach((b) =>
            b.addEventListener("click", () => {
              const choice = Number(b.dataset.option);
              if (t.quiz.type === "multi") {
                b.classList.toggle("selected");
                return;
              }
              const opts = $("#detailView").querySelectorAll(".option");
              opts.forEach((x, i) => {
                x.classList.toggle("correct", i === t.quiz.answer);
                x.classList.toggle("wrong", i === choice && choice !== t.quiz.answer);
              });
              showQuizResult(t, choice === t.quiz.answer);
            }),
          );
        const submitMulti = $("#submit-multi");
        if (submitMulti)
          submitMulti.addEventListener("click", () => {
            const chosen = [...$("#detailView").querySelectorAll(".option.selected")].map((x) =>
              Number(x.dataset.option),
            );
            const correct =
              chosen.length === t.quiz.answer.length &&
              chosen.every((x) => t.quiz.answer.includes(x));
            const opts = $("#detailView").querySelectorAll(".option");
            opts.forEach((x, i) => {
              x.classList.toggle("correct", t.quiz.answer.includes(i));
              x.classList.toggle(
                "wrong",
                x.classList.contains("selected") && !t.quiz.answer.includes(i),
              );
            });
            showQuizResult(t, correct);
          });
        const sortList = $("#detailView .sort-list");
        if (sortList) {
          sortList.querySelectorAll("[data-move]").forEach((b) =>
            b.addEventListener("click", () => {
              const row = b.closest(".sort-row");
              const target =
                b.dataset.move === "up" ? row.previousElementSibling : row.nextElementSibling;
              if (!target) return;
              if (b.dataset.move === "up") sortList.insertBefore(row, target);
              else sortList.insertBefore(target, row);
              [...sortList.children].forEach(
                (x, i) =>
                  (x.querySelector(".sort-index").textContent = (i + 1)
                    .toString()
                    .padStart(2, "0")),
              );
            }),
          );
          $("#submit-sort").addEventListener("click", () => {
            const order = [...sortList.children].map((x) => Number(x.dataset.sortIndex));
            showQuizResult(
              t,
              order.every((x, i) => x === t.quiz.answer[i]),
            );
          });
        }
      }
      document.querySelectorAll("[data-domain]").forEach((b) =>
        b.addEventListener("click", () => {
          state.domain = b.dataset.domain;
          state.module = null;
          state.topic = null;
          state.tab = "explain";
          state.home = false;
          document
            .querySelectorAll("[data-domain],[data-home]")
            .forEach((x) => x.classList.toggle("active", x === b));
          $("#detailView").classList.remove("visible");
          $("#listView").classList.remove("hidden");
          renderSidebar();
          renderList();
        }),
      );
      $("[data-home]").addEventListener("click", () => {
        state.home = true;
        state.module = null;
        state.topic = null;
        state.tab = "explain";
        document
          .querySelectorAll("[data-domain],[data-home]")
          .forEach((x) => x.classList.toggle("active", x.hasAttribute("data-home")));
        $("#detailView").classList.remove("visible");
        $("#listView").classList.remove("hidden");
        renderSidebar();
        renderList();
      });
      $("[data-plan-open]").addEventListener("click", openPlan);
      $("[data-plan-close]").addEventListener("click", closePlan);
      $("[data-plan-save]").addEventListener("click", savePlan);
      $("#planOverlay").addEventListener("click", (event) => {
        if (event.target.id === "planOverlay") closePlan();
      });
      document.querySelectorAll("[data-plan-range]").forEach((button) =>
        button.addEventListener("click", () => {
          planState.range = button.dataset.planRange;
          document
            .querySelectorAll("[data-plan-range]")
            .forEach((item) => item.classList.toggle("active", item === button));
          renderPlan();
        }),
      );
      document.querySelectorAll("[data-mastery-filter]").forEach((button) =>
        button.addEventListener("click", () => {
          const level = Number(button.dataset.masteryFilter);
          state.masteryFilter = state.masteryFilter === level ? null : level;
          syncMasteryFilter();
          renderSidebar();
        }),
      );
      const baseRenderList = renderList;
      renderList = function () {
        if (state.home || !state.module) {
          renderOverview();
          return;
        }
        baseRenderList();
      };
      const explainObserver = new MutationObserver(() => {
        const panel = $("#panel-explain");
        if (panel && !panel.dataset.enhanced && state.topic) {
          panel.dataset.enhanced = "1";
          enhanceExplain(state.topic);
        }
      });
      explainObserver.observe($("#detailView"), { childList: true });
      renderSidebar();
      renderList();
    </script>
  </body>
</html>
